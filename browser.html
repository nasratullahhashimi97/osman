
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quiz Game - Student Competition</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 25px;
            text-align: center;
            color: #1e293b;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        h1, h2 {
            color: #1e3a8a;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 18px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #1e40af;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option {
            display: block;
            width: 100%;
            margin: 10px 0;
            text-align: left;
            background: #eff6ff;
            color: #1e3a8a;
            border: 2px solid #dbeafe;
        }

        .option:hover {
            background: #dbeafe;
        }

        .option.selected {
            border-color: #2563eb;
            background: #dbeafe;
        }

        #result {
            font-weight: bold;
            margin: 20px;
        }

        .score {
            color: #b45309;
            font-size: 20px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #cbd5e1;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }

        .winner {
            color: #15803d;
            font-weight: bold;
        }

        .danger {
            background: #dc2626;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Quiz Game</h1>
    <p>Student Quiz Competition System</p>

    <!-- STUDENT REGISTRATION -->
    <section id="registration">
        <h2>Student Registration</h2>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your full name"
            required
        >

        <input
            type="text"
            id="studentId"
            placeholder="Enter your student ID"
            required
        >

        <button onclick="startQuiz()">Register & Start Quiz</button>

        <p id="registrationMessage"></p>
    </section>

    <!-- QUIZ SECTION -->
    <section id="quizSection" class="hidden">

        <h2 id="welcome"></h2>

        <p id="questionNumber"></p>

        <h3 id="question"></h3>

        <div id="options"></div>

        <p id="result"></p>

        <p class="score" id="score">Score: 0 / 10</p>

        <button id="nextButton" onclick="nextQuestion()" disabled>
            Next Question
        </button>

    </section>

    <!-- COMPLETED SECTION -->
    <section id="completedSection" class="hidden">

        <h2>Quiz Completed!</h2>

        <p id="finalMessage"></p>

        <p class="score" id="finalScore"></p>

        <button onclick="showLeaderboard()">
            View Student Results
        </button>

        <button onclick="newStudent()">
            Register Another Student
        </button>

    </section>

    <!-- LEADERBOARD -->
    <section id="leaderboardSection">

        <h2>Student Leaderboard</h2>

        <p id="winnerMessage">Complete the quiz to see the results.</p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Student Name</th>
                        <th>Student ID</th>
                        <th>Marks</th>
                        <th>Percentage</th>
                    </tr>
                </thead>

                <tbody id="leaderboard"></tbody>
            </table>
        </div>

        <button onclick="refreshLeaderboard()">
            Refresh Results
        </button>

    </section>

</div>

<script>
    // QUIZ QUESTIONS

    const questions = [
        {
            question: "1. What is the capital of Afghanistan?",
            options: ["Herat", "Kabul", "Kandahar", "Jalalabad"],
            answer: "Kabul"
        },
        {
            question: "2. Which language is used to structure a web page?",
            options: ["CSS", "JavaScript", "HTML", "Python"],
            answer: "HTML"
        },
        {
            question: "3. What does CSS control?",
            options: [
                "Web page design",
                "Computer hardware",
                "Internet speed",
                "File storage"
            ],
            answer: "Web page design"
        },
        {
            question: "4. Which language can make a web page interactive?",
            options: ["HTML only", "CSS only", "JavaScript", "SQL only"],
            answer: "JavaScript"
        },
        {
            question: "5. What is 12 + 8?",
            options: ["18", "20", "22", "24"],
            answer: "20"
        },
        {
            question: "6. Which device is used to type text?",
            options: ["Monitor", "Keyboard", "Speaker", "Printer"],
            answer: "Keyboard"
        },
        {
            question: "7. Which planet do we live on?",
            options: ["Mars", "Venus", "Earth", "Jupiter"],
            answer: "Earth"
        },
        {
            question: "8. Which company developed Windows?",
            options: ["Google", "Microsoft", "Apple", "Samsung"],
            answer: "Microsoft"
        },
        {
            question: "9. What does CPU stand for?",
            options: [
                "Central Processing Unit",
                "Computer Personal Unit",
                "Central Program User",
                "Control Power Utility"
            ],
            answer: "Central Processing Unit"
        },
        {
            question: "10. Which HTML tag creates a link?",
            options: ["<p>", "<h1>", "<a>", "<img>"],
            answer: "<a>"
        }
    ];

    // GAME VARIABLES

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = "";
    let student = {};

    // GET SAVED RESULTS

    function getStudents() {
        try {
            const saved = JSON.parse(
                localStorage.getItem("quizStudents") || "[]"
            );

            return Array.isArray(saved) ? saved : [];
        } catch (error) {
            return [];
        }
    }

    // SAVE RESULTS

    function saveStudents(students) {
        try {
            localStorage.setItem(
                "quizStudents",
                JSON.stringify(students)
            );

            return true;
        } catch (error) {
            alert("Results could not be saved in this browser.");
            return false;
        }
    }

    // REGISTER STUDENT

    function startQuiz() {
        const name = document.getElementById("studentName")
            .value.trim();

        const id = document.getElementById("studentId")
            .value.trim();

        const message = document.getElementById(
            "registrationMessage"
        );

        if (name === "" || id === "") {
            message.textContent =
                "Please enter both your name and student ID.";
            return;
        }

        const students = getStudents();

        const alreadyRegistered = students.some(
            s => s.id.toLowerCase() === id.toLowerCase()
        );

        if (alreadyRegistered) {
            message.textContent =
                "This student ID has already completed the quiz.";
            return;
        }

        student = {
            name: name,
            id: id
        };

        currentQuestion = 0;
        score = 0;

        document.getElementById("registration").classList.add("hidden");
        document.getElementById("completedSection").classList.add("hidden");
        document.getElementById("leaderboardSection").classList.add("hidden");
        document.getElementById("quizSection").classList.remove("hidden");

        document.getElementById("welcome").textContent =
            "Welcome, " + student.name + "!";

        document.getElementById("score").textContent = "Score: 0 / 10";

        showQuestion();
    }

    // DISPLAY QUESTION

    function showQuestion() {
        selectedAnswer = "";

        const q = questions[currentQuestion];

        document.getElementById("questionNumber").textContent =
            "Question " + (currentQuestion + 1) +
            " of " + questions.length;

        document.getElementById("question").textContent = q.question;

        document.getElementById("result").textContent = "";

        document.getElementById("nextButton").disabled = true;

        document.getElementById("nextButton").textContent =
            currentQuestion === questions.length - 1
                ? "Finish Quiz"
                : "Next Question";

        const optionsContainer = document.getElementById("options");
        optionsContainer.replaceChildren();

        q.options.forEach(function(option) {
            const button = document.createElement("button");

            button.textContent = option;
            button.className = "option";

            button.onclick = function() {
                selectAnswer(option, button);
            };

            optionsContainer.appendChild(button);
        });
    }

    // SELECT ANSWER

    function selectAnswer(answer, button) {
        if (selectedAnswer !== "") {
            return;
        }

        selectedAnswer = answer;

        document.querySelectorAll(".option").forEach(function(btn) {
            btn.disabled = true;
        });

        button.classList.add("selected");

        if (answer === questions[currentQuestion].answer) {
            score++;

            document.getElementById("result").textContent =
                "Correct answer!";

            document.getElementById("result").style.color =
                "#15803d";
        } else {
            document.getElementById("result").textContent =
                "Wrong answer! Correct answer: " +
                questions[currentQuestion].answer;

            document.getElementById("result").style.color =
                "#dc2626";
        }

        document.getElementById("score").textContent =
            "Score: " + score + " / 10";

        document.getElementById("nextButton").disabled = false;
    }

    // MOVE TO NEXT QUESTION

    function nextQuestion() {
        if (selectedAnswer === "") {
            return;
        }

        currentQuestion++;

        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    // FINISH QUIZ AND SAVE RESULT

    function finishQuiz() {
        const students = getStudents();

        const record = {
            name: student.name,
            id: student.id,
            score: score,
            total: questions.length,
            percentage: score / questions.length * 100,
            date: new Date().toISOString()
        };

        students.push(record);

        if (!saveStudents(students)) {
            currentQuestion = questions.length - 1;
            currentQuestion--;
            return;
        }

        document.getElementById("quizSection").classList.add("hidden");

        document.getElementById("completedSection")
            .classList.remove("hidden");

        document.getElementById("finalMessage").textContent =
            "Well done, " + student.name + "!";

        document.getElementById("finalScore").textContent =
            "Your Marks: " + score + " / " + questions.length +
            " (" + record.percentage + "%)";

        showLeaderboard();
    }

    // SHOW LEADERBOARD AND WINNERS

    function showLeaderboard() {
        document.getElementById("leaderboardSection")
            .classList.remove("hidden");

        refreshLeaderboard();

        document.getElementById("leaderboardSection")
            .scrollIntoView({ behavior: "smooth" });
    }

    function refreshLeaderboard() {
        const students = getStudents();

        students.sort(function(a, b) {
            return b.score - a.score;
        });

        const table = document.getElementById("leaderboard");
        table.replaceChildren();

        if (students.length === 0) {
            document.getElementById("winnerMessage").textContent =
                "No students have completed the quiz yet.";
            return;
        }

        const highestScore = students[0].score;

        const winners = students.filter(
            s => s.score === highestScore
        );

        document.getElementById("winnerMessage").textContent =
            highestScore === 0
                ? "No correct answers yet."
                : winners.length === 1
                    ? "🏆 Winner: " + winners[0].name +
                      " with " + highestScore + " / 10 marks!"
                    : "🏆 Tie! " +
                      winners.map(s => s.name).join(", ") +
                      " share first place with " + highestScore + " / 10.";

        students.forEach(function(s, index) {
            const row = document.createElement("tr");

            if (s.score === highestScore) {
                row.className = "winner";
            }

            [
                index + 1,
                s.name,
                s.id,
                s.score + " / " + s.total,
                s.percentage + "%"
            ].forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            table.appendChild(row);
        });
    }

    // REGISTER THE NEXT STUDENT

    function newStudent() {
        document.getElementById("completedSection")
            .classList.add("hidden");

        document.getElementById("leaderboardSection")
            .classList.add("hidden");

        document.getElementById("registration")
            .classList.remove("hidden");

        document.getElementById("studentName").value = "";
        document.getElementById("studentId").value = "";

        document.getElementById("registrationMessage").textContent = "";

        document.getElementById("studentName").focus();
    }

</script>

</body>
</html>
